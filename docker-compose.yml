# Base común a dev y prod (ADR-08). Sin puertos publicados: cada overlay decide qué expone.
# Las versiones de imagen están fijadas aquí (ADR-01/ADR-02, riesgo R03). Nunca usar "latest".
# Ningún servicio usa env_file: cada uno recibe solo las variables que necesita.
name: cil-admision

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
      # Solo los usa infra/postgres/init/01-crear-bases.sh en el primer arranque del volumen
      ADMISION_DB: ${ADMISION_DB}
      ADMISION_DB_USER: ${ADMISION_DB_USER}
      ADMISION_DB_PASSWORD: ${ADMISION_DB_PASSWORD}
      N8N_DB: ${N8N_DB}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # El comando lo define cada overlay (dev: start-dev; prod: start detrás de NGINX).
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Emisor estable (iss) para la API; la API y n8n llegan por la red interna (backchannel).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Placeholders que usa infra/keycloak/realm-cil-admision.json al importarse
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      TZ: America/Lima
    volumes:
      - ./infra/keycloak/realm-cil-admision.json:/opt/keycloak/data/import/realm-cil-admision.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready del puerto de gestión con bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [interna]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.42.5
    # Variables declaradas una por una (ajuste A): nunca claves de cifrado de la API,
    # secretos de Keycloak ni contraseñas de otras bases.
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # n8n 2.x bloquea $env por defecto; los flujos leen URLs y el token de servicio con $env (rules/n8n.md)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED}
      SMTP_FROM: ${SMTP_FROM}
      N8N_PORT: "5678"
      GENERIC_TIMEZONE: America/Lima
      TZ: America/Lima
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [interna]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Solo lo que la API necesita hoy. KEYCLOAK_API_CLIENT_SECRET e INTERNAL_API_TOKEN se agregan
    # cuando existan identidad/keycloakAdmin (HU0004/HU0021) y las rutas /internal/* (Etapa C).
    environment:
      API_PORT: ${API_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ADMISION_DB: ${ADMISION_DB}
      ADMISION_DB_USER: ${ADMISION_DB_USER}
      ADMISION_DB_PASSWORD: ${ADMISION_DB_PASSWORD}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      DATA_HMAC_KEY: ${DATA_HMAC_KEY}
      TZ: America/Lima
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.API_PORT+'/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [interna]
    restart: unless-stopped

networks:
  interna:

volumes:
  pgdata:
  n8n_data:
