# Base común a dev y prod (ADR-08). Sin puertos publicados: cada overlay decide qué expone.
# Las versiones de imagen están fijadas aquí (ADR-01/ADR-02, riesgo R03). Nunca usar "latest".
# Ningún servicio usa env_file: cada uno recibe solo las variables que necesita.
name: cil-admision

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
      # Solo los usan los scripts de infra/postgres/init/ (primer arranque o npm run db:roles)
      ADMISION_DB: ${ADMISION_DB}
      ADMISION_DB_USER: ${ADMISION_DB_USER}
      ADMISION_DB_PASSWORD: ${ADMISION_DB_PASSWORD}
      ADMISION_MIGRATOR_USER: ${ADMISION_MIGRATOR_USER}
      ADMISION_MIGRATOR_PASSWORD: ${ADMISION_MIGRATOR_PASSWORD}
      N8N_DB: ${N8N_DB}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # El comando lo define cada overlay (dev: start-dev; prod: start detrás de NGINX).
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Emisor estable (iss) para la API; la API y n8n llegan por la red interna (backchannel).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Placeholders que usa infra/keycloak/realm-cil-admision.json al importarse
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      # SMTP del realm: Keycloak envía el enlace para definir la contraseña del personal (HU0021, ADR-07 excepción)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM}
      # Campaña activa que muestra el tema G01 (HU0022, C23): theme.properties la lee con ${env.CAMPANA_ACTIVA}
      CAMPANA_ACTIVA: ${CAMPANA_ACTIVA}
      TZ: America/Lima
    volumes:
      - ./infra/keycloak/realm-cil-admision.json:/opt/keycloak/data/import/realm-cil-admision.json:ro
      # Tema de login del CIL (G01 en HU0021); el cliente lo elige con su atributo login_theme
      - ./infra/keycloak/themes/cil:/opt/keycloak/themes/cil:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready del puerto de gestión con bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [interna]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.42.5
    # Variables declaradas una por una (ajuste A): nunca claves de cifrado de la API,
    # secretos de Keycloak ni contraseñas de otras bases. Los secretos que usan los flujos
    # (token de la API interna, secreto del webhook, SMTP) viven en credenciales de n8n, no aquí.
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # n8n 2.x bloquea $env por defecto; los flujos leen con $env solo configuración no secreta
      # (URLs, banderas, remitente), según rules/n8n.md
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED}
      SMTP_FROM: ${SMTP_FROM}
      N8N_PORT: "5678"
      GENERIC_TIMEZONE: America/Lima
      TZ: America/Lima
      # Ventana de las ejecuciones que no se guardan (ADR-02 D3, R1; C10, C11): n8n 2.42.5 no las borra al terminar, las
      # marca con deletedAt y el borrado físico corre cada EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL minutos (15 por
      # defecto). Cada minuto: la contraseña temporal y X-Webhook-Secret quedan legibles 1 min como máximo.
      # El búfer (horas) no alarga la ventana de las ejecuciones automáticas, pero sí la de las manuales
      # (saveManualExecutions: false en agendamiento): en 0, también se borran en el siguiente ciclo. La poda por
      # antigüedad (EXECUTIONS_DATA_PRUNE, EXECUTIONS_DATA_MAX_AGE) sigue con sus valores por defecto (C10).
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: "1"
      EXECUTIONS_DATA_HARD_DELETE_BUFFER: "0"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [interna]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Solo lo que la API necesita hoy. KEYCLOAK_API_CLIENT_SECRET lo usa identidad/keycloakAdmin (HU0021).
    environment:
      API_PORT: ${API_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ADMISION_DB: ${ADMISION_DB}
      ADMISION_DB_USER: ${ADMISION_DB_USER}
      ADMISION_DB_PASSWORD: ${ADMISION_DB_PASSWORD}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID}
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      DATA_HMAC_KEY: ${DATA_HMAC_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # Campaña activa (HU0022, C23): G09 solo configura los grados y horarios de esta campaña.
      CAMPANA_ACTIVA: ${CAMPANA_ACTIVA}
      # Eventos de la API hacia n8n (ADR-16, HU0001): webhook interno del flujo con X-Webhook-Secret.
      # Es el mismo secreto que la credencial cil-webhook-secret de n8n: al rotarlo hay que recrear api (C11).
      N8N_WEBHOOK_INTERNAL_URL: ${N8N_WEBHOOK_INTERNAL_URL}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      # Carpeta informativa y enlace para agendar la visita (HU0002, ADR-18). CARPETA_INFORMATIVA_URL puede quedar
      # vacía (el correo lo dice entre corchetes, C33). ENLACE_VISITA_KEY cifra el id del expediente en el enlace de P02.
      CARPETA_INFORMATIVA_URL: ${CARPETA_INFORMATIVA_URL}
      ENLACE_VISITA_KEY: ${ENLACE_VISITA_KEY}
      # Visita guiada (HU0003, ADR-19): horas de anticipación del recordatorio (D4, provisional: C37) y dirección del
      # colegio para «Lugar» de P02 y de los correos (puede quedar vacía: se ve «[Dirección del colegio]», C39).
      RECORDATORIO_VISITA_HORAS: ${RECORDATORIO_VISITA_HORAS}
      DIRECCION_COLEGIO: ${DIRECCION_COLEGIO}
      # Buzón del personal de admisión para el aviso del dictamen «En observación» (HU0010-2.0, ADR-25). Obligatoria.
      CORREO_ADMISION: ${CORREO_ADMISION}
      # Archivos de documentos y comprobantes (HU0006 y HU0007, ADR-12 D1 y ADR-21): adaptador local sobre el volumen
      # `archivos`, siempre cifrados. ARCHIVOS_ENCRYPTION_KEY_ANTERIOR solo se define al rotar la clave (C47).
      STORAGE_DRIVER: ${STORAGE_DRIVER}
      STORAGE_LOCAL_DIR: /var/lib/cil/archivos
      ARCHIVOS_ENCRYPTION_KEY: ${ARCHIVOS_ENCRYPTION_KEY}
      ARCHIVOS_ENCRYPTION_KEY_ANTERIOR: ${ARCHIVOS_ENCRYPTION_KEY_ANTERIOR:-}
      # Tope técnico provisional de archivos vigentes por requisito en P06 (ADR-19); sin definir en .env, 20.
      MAX_DOCUMENTOS_POR_REQUISITO: ${MAX_DOCUMENTOS_POR_REQUISITO:-20}
      # Horas mínimas para reprogramar una cita de evaluación (HU0009-2.0, ADR-19); sin definir en .env, 24.
      REPROGRAMACION_MIN_HORAS: ${REPROGRAMACION_MIN_HORAS:-24}
      TZ: America/Lima
    volumes:
      - archivos:/var/lib/cil/archivos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.API_PORT+'/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      # Una caída se marca unhealthy en ~30 s (3 × 10 s). Durante el arranque (start_period) se
      # revisa cada 2 s y los fallos no cuentan.
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks: [interna]
    restart: unless-stopped

networks:
  interna:

volumes:
  pgdata:
  n8n_data:
  # Archivos de la API (D1, ADR-12): pg_dump no los respalda (C35).
  archivos:
