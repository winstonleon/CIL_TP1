# Tema de login del CIL. HU0021: G01 (acceso del personal) para gestion-interna; HU0023: P03, P03b y P03c para
# portal-familias. Los dos clientes lo tienen asignado con su atributo login_theme (realm-cil-admision.json); login.ftl
# y login-update-password.ftl distinguen el cliente. Las demás páginas (recuperar la contraseña, enlace vencido,
# errores) se heredan de keycloak.v2, en español (defaultLocale del realm).
parent=keycloak.v2
# Campaña activa (HU0022, C23): la misma variable CAMPANA_ACTIVA que usa la API. Keycloak sustituye ${env.*} al
# leer el tema; si la variable falta, queda vacía y G01 muestra solo el nombre del colegio.
campanaActiva=${env.CAMPANA_ACTIVA:}
# HU0023: URL pública del frontend, para el enlace «Aún no visito el colegio» de P03 (lleva a P01: P02 exige el enlace de la
# carpeta). El contenedor ya recibe FRONTEND_PUBLIC_URL. Si falta, el enlace no se muestra.
portalPublico=${env.FRONTEND_PUBLIC_URL:}
