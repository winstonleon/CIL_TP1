# Tema de login del CIL. HU0021: G01 (acceso del personal) para el cliente gestion-interna, asignado con el
# atributo login_theme del cliente en realm-cil-admision.json. HU0023 agregará P03, P03b y P03c para
# portal-familias. Solo se sobrescribe login.ftl: las demás páginas (definir la contraseña desde el enlace,
# enlace vencido, errores) se heredan de keycloak.v2, en español (defaultLocale del realm).
parent=keycloak.v2
# Campaña activa (HU0022, C23): la misma variable CAMPANA_ACTIVA que usa la API. Keycloak sustituye ${env.*} al
# leer el tema; si la variable falta, queda vacía y G01 muestra solo el nombre del colegio.
campanaActiva=${env.CAMPANA_ACTIVA:}
